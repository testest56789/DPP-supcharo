<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
            margin: 0;
            padding: 20px;
        }
        .main-title {
            color: white;
            text-align: center;
            font-size: 2.5em;
        }
        .shop-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
            text-align: center;
        }
        .shop-item img {
            width: 200px;
            height: auto;
        }
        .footer {
            text-align: right;
            font-style: italic;
            font-family: monospace;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <h1 class="main-title"> Basics </h1>

    <div class="shop-container">
        <div class="shop-item">
            <img src="google.jpg" alt="Shop 1">
            <br>
            <a href="https://www.google.com/" target="_blank">Google</a>
        </div>
        <div class="shop-item">
            <img src="git_hub.jpg" alt="Shop 2">
            <br>
            <a href="https://github.com/" target="_blank">github</a>
        </div>
    </div>

    <hr>

    <div class="footer">
        &copy; supcharo 2026
    </div>

</body>
</html>
