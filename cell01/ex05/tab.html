<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            width: 50%;
            height: 150px;
            text-align: center;
            vertical-align: middle;
            font-family: Arial, sans-serif;
            font-size: 18px;
        }
        .cell1 {
            background-color: #c2c583;
        }
        .cell2 {
            background-color: #f1b8a7;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="cell1">First cell</td>
            <td class="cell2">Second cell</td>
        </tr>
    </table>

</body>
</html>
